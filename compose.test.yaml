name: syncflow-db-tests
services:
  mysql-test:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: syncflow_test
      MYSQL_USER: syncflow_test
      MYSQL_PASSWORD: test-only-password
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u $$MYSQL_USER -D $$MYSQL_DATABASE -e 'SELECT 1' >/dev/null"]
      interval: 2s
      timeout: 5s
      retries: 60
  redis-test:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
  db-tests:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      target: test
    environment:
      REDIS_ADDR: redis-test:6379
      REDIS_JOB_QUEUE: syncflow:test:jobs
      PYTHONPATH: /app
      MYSQL_HOST: mysql-test
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: syncflow_test
      MYSQL_USER: syncflow_test
      MYSQL_PASSWORD: test-only-password
    volumes:
      - ./backend/tests:/app/tests:ro
      - ./output/db-tests:/reports
    command: ["python", "tests/reporting.py"]
    depends_on:
      mysql-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
